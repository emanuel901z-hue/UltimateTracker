name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  compose:
    name: Compose-Konfiguration (alle Profile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: .env vorbereiten
        run: cp server/.env.example server/.env
      - name: Profile validieren
        working-directory: server
        run: |
          docker compose config -q
          docker compose --profile findmy config -q
          docker compose --profile google-minimal config -q

  bridge:
    name: Bridge (Syntax + Unit-Tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile server/audio-bridge/app/main.py
      - name: Test-Abhängigkeiten installieren
        run: pip install requests websockets
      - name: Unit-Tests der Provider-Schicht
        working-directory: server/audio-bridge
        run: python -m unittest discover -s tests -v
      - name: Barrierefreiheit der UI prüfen (WCAG 2.2 AA, maschinell prüfbar)
        run: python scripts/check-ui-a11y.py

  smoke:
    name: Smoke-Test gegen den Stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: .env mit Test-Tokens
        run: |
          cp server/.env.example server/.env
          sed -i 's/change-me-device-token/test-device-token/; s/change-me-parent-token/test-parent-token/' server/.env
          # Administrator für die Login-/Benutzerverwaltungs-Tests: ohne ihn gäbe es
          # nur den temporären Benutzer aus Gruppe 18, der zu Recht geschützt ist.
          sed -i 's/^PARENT_PASSWORD=$/PARENT_PASSWORD=ci-test-passwort-2026/' server/.env
          echo "Gesetzte Schlüssel:"; grep -oE '^(DEVICE_TOKEN|PARENT_TOKEN|PARENT_USER|PARENT_PASSWORD)=' server/.env
      - name: Stack starten
        working-directory: server
        run: docker compose up -d --build
      - name: Auf Bereitschaft warten
        run: |
          for i in $(seq 1 40); do
            if curl -sf http://localhost:8085/healthz >/dev/null && \
               curl -sf -o /dev/null http://localhost:8082/api/server; then
              echo "Stack bereit nach $((i * 5)) s"; exit 0
            fi
            sleep 5
          done
          echo "Stack nicht bereit – Logs:"; docker compose -f server/docker-compose.yml logs --tail 60
          exit 1
      - name: Smoke-Test ausführen
        run: bash scripts/smoke-test.sh
        env:
          SERVER_DIR: ${{ github.workspace }}/server
      - name: Simulator ausführen
        run: python3 scripts/simulate-tracker.py --cycles 2 --send-audio --env server/.env
      - name: Logs bei Fehlern
        if: failure()
        run: docker compose -f server/docker-compose.yml logs --tail 80

  ui:
    name: UI in headless Chrome (Screenshots + Accessibility-Baum)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: .env mit Test-Tokens
        run: |
          cp server/.env.example server/.env
          sed -i 's/change-me-device-token/test-device-token/; s/change-me-parent-token/test-parent-token/' server/.env
          sed -i 's/^PARENT_PASSWORD=$/PARENT_PASSWORD=ci-test-passwort-2026/' server/.env
      - name: Stack starten
        working-directory: server
        run: docker compose up -d --build
      - name: Auf Bereitschaft warten
        run: |
          for i in $(seq 1 40); do
            if curl -sf http://localhost:8085/healthz >/dev/null; then
              echo "Bridge bereit nach $((i * 5)) s"; exit 0
            fi
            sleep 5
          done
          echo "Bridge nicht bereit – Logs:"; docker compose -f server/docker-compose.yml logs --tail 60
          exit 1
      - name: websockets installieren
        run: pip install websockets
      - name: Screenshots + Accessibility-Baum prüfen
        run: python scripts/ui-check.py --out ui-shots
      - name: Screenshots als Artefakt ablegen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: ui-shots/*.png
          retention-days: 14
      - name: Logs bei Fehlern
        if: failure()
        run: docker compose -f server/docker-compose.yml logs --tail 80

  firmware:
    name: Firmware-Build + native Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: PlatformIO installieren
        run: pip install platformio
      - name: Bauen (Release, Dev- und Bring-up-Env)
        working-directory: firmware
        run: pio run -e tsim7080g-s3 -e tsim7080g-s3-dev -e tsim7080g-s3-bringup
      - name: Host-Tests der Logik (ADPCM, Protokoll, Wake-Policy, …)
        working-directory: firmware
        run: pio test -e native
