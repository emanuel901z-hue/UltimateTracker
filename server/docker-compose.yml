name: ultimatetracker

# Zentrale Log-Rotation (docs/optimizations.md A7)
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    # Produktiv-Datenbank (A10). H2-Fallback: DATABASE_* in server/.env auf die
    # H2-Werte setzen und diesen Dienst stoppen (siehe .env.example).
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: traccar
      POSTGRES_USER: ${POSTGRES_USER:-traccar}
      # Nur für die interne Datenbank – ohne .env wird ein Standardwert genutzt
      # (der Port ist nicht veröffentlicht).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ultimatetracker-intern}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-traccar} -d traccar"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - utnet

  traccar:
    # Version gepinnt (A2). Update: Version ändern + `docker compose pull traccar`.
    image: traccar/traccar:6.16.0
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "8082:8082"   # Web-UI
      - "5055:5055"   # OsmAnd-Protokoll (Tracker-Uploads)
    environment:
      # Datenbank per Umgebungsvariablen (überschreibt traccar.xml, A10)
      CONFIG_USE_ENVIRONMENT_VARIABLES: "true"
      DATABASE_DRIVER: ${DATABASE_DRIVER:-org.postgresql.Driver}
      DATABASE_URL: ${DATABASE_URL:-jdbc:postgresql://postgres:5432/traccar}
      DATABASE_USER: ${DATABASE_USER:-traccar}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-ultimatetracker-intern}
    volumes:
      - ./traccar/traccar.xml:/opt/traccar/conf/traccar.xml:ro
      - traccar-data:/opt/traccar/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8082/api/server || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - utnet

  audio-bridge:
    build: ./audio-bridge
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "8085:8085"   # Web-UI + API (Tracker & Eltern)
    env_file:
      # Optional: fehlt die Datei, erzeugt die Bridge Tokens und Traccar-Zugang
      # selbst (Erststart ohne Terminal).
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
    volumes:
      - audio-data:/data
      # Provider-Konfigurationen (Template für andere SIM-Anbieter, docs/sim-providers.md)
      - ./sim-providers:/etc/ut/providers:ro
      # Root-Zertifikat der Caddy-CA zum Herunterladen (Eltern-UI → „Zertifikat einrichten")
      - caddy-data:/caddy-data:ro
    depends_on:
      - traccar
    healthcheck:
      test:
        ["CMD", "python", "-c",
         "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8085/healthz')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - utnet

  # ---------------------------------------------------------------------------
  # Optionales Profil "tls": Caddy als TLS-Reverse-Proxy (A3).
  # Start: docker compose --profile tls up -d
  # Danach die Ports 8082/8085/4321 nicht mehr nach außen veröffentlichen.
  # Details: docs/deployment.md (Abschnitt TLS)
  # ---------------------------------------------------------------------------

  caddy:
    image: caddy:2-alpine
    profiles: [tls]
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_AUDIO: ${SITE_AUDIO:-audio.localhost}
      SITE_TRACCAR: ${SITE_TRACCAR:-traccar.localhost}
      SITE_FINDMY: ${SITE_FINDMY:-findmy.localhost}
      SITE_APPLE: ${SITE_APPLE:-apple.localhost}
      SITE_LAN: ${SITE_LAN:-localhost}
      TLS_ARG: ${TLS_ARG:-internal}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - utnet

  # ---------------------------------------------------------------------------
  # Optionales Profil "findmy": Gegenstücke für Apple Find My (OpenHaystack)
  # und Google Find Hub (Find My Device) – beide EXPERIMENTELL.
  # Start:   docker compose --profile findmy up -d
  # Details: docs/findmy.md
  # ---------------------------------------------------------------------------

  anisette:
    # Apple-Authentifizierung (Anisette-Daten) für die Find-My-Bridge.
    # Rein interner Dienst – kein veröffentlichter Port.
    image: dadoum/anisette-v3-server:latest
    profiles: [findmy]
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - anisette-data:/home/Alcoholic/.config/anisette-v3
    networks:
      - utnet

  findmy-bridge:
    # Apple → Traccar: automatische Synchronisation von OpenHaystack-/DIY-Beacons
    # über findmy.py (nutzt den anisette-Dienst). Echte AirTags brauchen zusätzlich
    # eine macOS-Key-Extraktion. Erst-Einrichtung interaktiv (siehe docs/findmy.md).
    # Hinweis: 1 Abfrage/Stunde (Default) gilt als account-sicher.
    # Commit gepinnt (A2); Update: neuen Commit-Hash von GitHub übernehmen.
    build: https://github.com/jannisko/findmy-traccar-bridge.git#4e4ae2535d024470cfa6e12a0a60f91d5ccee54a
    profiles: [findmy]
    # Ohne APPLE_BEACON_KEYS beendet sich der Dienst sauber (Exit 0) → kein
    # Endlos-Neustart; echte Abstürze werden bis zu 3× wiederholt.
    restart: on-failure:3
    logging: *default-logging
    environment:
      BRIDGE_TRACCAR_SERVER: http://traccar:5055
      BRIDGE_PRIVATE_KEYS: ${APPLE_BEACON_KEYS:-}
      BRIDGE_POLL_INTERVAL: ${APPLE_POLL_INTERVAL:-3600}
      BRIDGE_LOGGING_LEVEL: INFO
      # Optional (je nach Bridge-Version/Fork): eigener Anisette-Dienst statt Default
      BRIDGE_ANISETTE_SERVER: http://anisette:6969
    volumes:
      - findmy-bridge-data:/bridge/data
    depends_on:
      anisette:
        condition: service_started
      traccar:
        condition: service_healthy
    networks:
      - utnet

  macless-haystack:
    # Apple-Find-My-Endpoint: Key-Generierung und optionale Web-UI (manuelle Sicht).
    # Braucht beim ersten Start eine Apple-ID (interaktiv, 2FA) – ohne sie beendet
    # sich der Dienst; deshalb kein Endlos-Neustart.
    # Kein veröffentlichter Port: erreichbar nur über Caddy (apple.localhost) und
    # damit hinter dem Single Sign-on der Eltern-UI.
    image: christld/macless-haystack:latest
    profiles: [findmy]
    restart: on-failure:3
    logging: *default-logging
    volumes:
      - macless-data:/app/endpoint/data
    depends_on:
      - anisette
    networks:
      - utnet

  google-findmy-webui:
    # EMPFOHLENER Google-Find-Hub-Weg: Web-UI mit Key-Rotations-Fix (PR #114),
    # Geräte-/Scheduling-Verwaltung, Traccar-Preset und Firmware-Build im Browser.
    # Digest gepinnt (A2); Update: `docker pull` + neuen Digest übernehmen.
    # Details: docs/findmy.md
    image: ghcr.io/p6g9yhk6/googlefindmytools@sha256:bda31fda3d0dcd1e25666742b97259b4ad72ab7605e86c5c017659ae4397c093
    profiles: [findmy]
    restart: unless-stopped
    logging: *default-logging
    # Kein veröffentlichter Port: erreichbar nur über Caddy (findmy.localhost) und
    # damit hinter dem Single Sign-on. Deshalb ist die Basic-Auth der WebUI
    # standardmäßig AUS (leer) – ein zweiter Login entfällt.
    environment:
      TZ: ${TZ:-Europe/Berlin}
      HTTP_USER: ${WEBUI_USER:-}
      HTTP_PASSWORD: ${WEBUI_PASSWORD:-}
      # Verschlüsselung der Tokens at rest (jeder String; Verlust = neu einloggen):
      SECRETS_ENCRYPTION_KEY: ${WEBUI_SECRETS_KEY:-}
      GFMT_DATA_DIR: /data
    volumes:
      - google-findmy-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:4321/health || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - utnet

  google-findmy:
    # MINIMAL-ALTERNATIVE (Profil "google-minimal"): reiner Microservice aus dem
    # Traccar-Fork; kein Web-UI, aber schlanker. Bekannter Key-Rotations-Bug –
    # dann auf die WebUI wechseln. Details: docs/findmy.md
    build: ./findmy-google
    profiles: [google-minimal]
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "5500:5500"
    environment:
      AUTH_TOKEN: ${GOOGLE_FINDMY_TOKEN:-change-me-google-token}
      PUSH_URL: http://audio-bridge:8085/api/v1/findmy/locations
      HOST: 0.0.0.0
      PORT: "5500"
    volumes:
      - google-findmy-auth:/app/Auth
    depends_on:
      audio-bridge:
        condition: service_healthy
    networks:
      - utnet

volumes:
  postgres-data:
  traccar-data:
  audio-data:
  caddy-data:
  caddy-config:
  anisette-data:
  macless-data:
  findmy-bridge-data:
  google-findmy-auth:
  google-findmy-data:

networks:
  utnet:
    driver: bridge
