name: ultimatetracker

services:
  traccar:
    # TODO: Version pinnen, sobald eine Referenzversion verifiziert ist.
    image: traccar/traccar:latest
    container_name: ut-traccar
    restart: unless-stopped
    ports:
      - "8082:8082"   # Web-UI
      - "5055:5055"   # OsmAnd-Protokoll (Tracker-Uploads)
    volumes:
      - ./traccar/traccar.xml:/opt/traccar/conf/traccar.xml:ro
      - traccar-data:/opt/traccar/data
    networks:
      - utnet

  audio-bridge:
    build: ./audio-bridge
    container_name: ut-audio-bridge
    restart: unless-stopped
    ports:
      - "8085:8085"   # Web-UI + API (Tracker & Eltern)
    env_file:
      - .env
    environment:
      DATA_DIR: /data
    volumes:
      - audio-data:/data
    depends_on:
      - traccar
    networks:
      - utnet

  # ---------------------------------------------------------------------------
  # Optionales Profil "findmy": Gegenstücke für Apple Find My (OpenHaystack)
  # und Google Find Hub (Find My Device) – beide EXPERIMENTELL.
  # Start:   docker compose --profile findmy up -d
  # Details: docs/findmy.md
  # ---------------------------------------------------------------------------

  anisette:
    # Apple-Authentifizierung (Anisette-Daten) für macless-haystack
    image: dadoum/anisette-v3-server:latest
    container_name: ut-anisette
    profiles: [findmy]
    restart: unless-stopped
    ports:
      - "6969:6969"
    volumes:
      - anisette-data:/home/Alcoholic/.config/anisette-v3
    networks:
      - utnet

  macless-haystack:
    # Apple-Find-My-Endpoint: Registrierung, Key-Generierung, Abruf der Standortberichte
    image: christld/macless-haystack:latest
    container_name: ut-macless-haystack
    profiles: [findmy]
    restart: unless-stopped
    ports:
      - "6176:6176"
    volumes:
      - macless-data:/app/endpoint/data
    depends_on:
      - anisette
    networks:
      - utnet

  google-findmy-webui:
    # EMPFOHLENER Google-Find-Hub-Weg: Web-UI mit Key-Rotations-Fix (PR #114),
    # Geräte-/Scheduling-Verwaltung, Traccar-Preset und Firmware-Build im Browser.
    # Details: docs/findmy.md
    image: ghcr.io/p6g9yhk6/googlefindmytools:latest
    container_name: ut-google-findmy-webui
    profiles: [findmy]
    restart: unless-stopped
    ports:
      - "4321:4321"
    environment:
      TZ: ${TZ:-Europe/Berlin}
      # Basis-Auth aktivieren (dringend empfohlen, siehe docs/findmy.md):
      HTTP_USER: ${WEBUI_USER:-}
      HTTP_PASSWORD: ${WEBUI_PASSWORD:-}
      # Verschlüsselung der Tokens at rest (jeder String; Verlust = neu einloggen):
      SECRETS_ENCRYPTION_KEY: ${WEBUI_SECRETS_KEY:-}
      GFMT_DATA_DIR: /data
    volumes:
      - google-findmy-data:/data
    networks:
      - utnet

  google-findmy:
    # MINIMAL-ALTERNATIVE (Profil "google-minimal"): reiner Microservice aus dem
    # Traccar-Fork; kein Web-UI, aber schlanker. Bekannter Key-Rotations-Bug –
    # dann auf die WebUI wechseln. Details: docs/findmy.md
    build: ./findmy-google
    container_name: ut-google-findmy
    profiles: [google-minimal]
    restart: unless-stopped
    ports:
      - "5500:5500"
    environment:
      AUTH_TOKEN: ${GOOGLE_FINDMY_TOKEN:-change-me-google-token}
      PUSH_URL: http://audio-bridge:8085/api/v1/findmy/locations
      HOST: 0.0.0.0
      PORT: "5500"
    volumes:
      - google-findmy-auth:/app/Auth
    depends_on:
      - audio-bridge
    networks:
      - utnet

volumes:
  traccar-data:
  audio-data:
  anisette-data:
  macless-data:
  google-findmy-auth:
  google-findmy-data:

networks:
  utnet:
    driver: bridge
