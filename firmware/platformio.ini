; UltimateTracker – ESP32-S3 + SIM7080G (LilyGO T-SIM7080G-S3 V1.0)
; Siehe docs/pinout.md und docs/measurement-plan.md
;
; Hinweis zur Platform: espressif32 6.x liefert Arduino-Core 2.x (ESP-IDF 4.4).
; Der *neue* I2S-Treiber (esp_driver_i2s, Full-Duplex) ist erst mit
; Arduino-Core 3.x verfügbar – dafür den pioarduino-Fork als Platform eintragen
; (platform = https://github.com/pioarduino/platform-espressif32/releases/...),
; sobald die Audio-Pipeline implementiert wird. Bis dahin: Legacy-Treiber.

[env:tsim7080g-s3]
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
framework = arduino

; ESP32-S3-WROOM-1 N16R8: 16 MB QIO-Flash, 8 MB OPI-PSRAM
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

monitor_speed = 115200
upload_speed = 921600

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=2

lib_deps =
    vshymanskyy/TinyGSM@0.12.0
    h2zero/NimBLE-Arduino@2.5.1

; Bibliotheken für die Inbetriebnahme (nach Bedarf aktivieren):
;    adafruit/Adafruit LIS3DH
;    adafruit/Adafruit Unified Sensor
