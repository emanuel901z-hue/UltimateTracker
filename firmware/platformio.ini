; UltimateTracker – ESP32-S3 + SIM7080G (LilyGO T-SIM7080G-S3 V1.0)
; Siehe docs/pinout.md, docs/esp32s3.md, docs/simulation.md, docs/measurement-plan.md
;
; Umgebungen:
;   tsim7080g-s3      = Release/Akkubetrieb: KEIN USB-CDC beim Boot (S3-Eigenheit!)
;   tsim7080g-s3-dev  = Entwicklung am USB: CDC + Debug-Ausgabe aktiv
;   native            = Host-Tests der reinen Logik (pio test -e native)
;
; Wichtig (docs/esp32s3.md): Mit ARDUINO_USB_CDC_ON_BOOT=1 wartet der ESP32-S3
; beim Start auf einen USB-Host – am Akku/Powerbank startet die Firmware dann
; nicht. Deshalb ist das im Release-Build aus.
;
; Platform: espressif32 6.x liefert Arduino-Core 2.x (ESP-IDF 4.4). Der neue
; I2S-Treiber (esp_driver_i2s, Full-Duplex) kommt erst mit Arduino-Core 3.x
; (pioarduino-Fork) – bis dahin Legacy-Treiber.

[platformio]
default_envs = tsim7080g-s3

[base_s3]
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
framework = arduino

; ESP32-S3-WROOM-1 N16R8: 16 MB QIO-Flash, 8 MB OPI-PSRAM
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

monitor_speed = 115200
upload_speed = 921600

lib_deps =
    vshymanskyy/TinyGSM@0.12.0
    h2zero/NimBLE-Arduino@2.5.1
    bblanchon/ArduinoJson@7.2.1

; Bibliotheken für die Inbetriebnahme (nach Bedarf aktivieren):
;    adafruit/Adafruit LIS3DH
;    adafruit/Adafruit Unified Sensor

[env:tsim7080g-s3]
extends = base_s3
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DUT_DEBUG_SERIAL=0
    -DCORE_DEBUG_LEVEL=0

[env:tsim7080g-s3-dev]
extends = base_s3
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DUT_DEBUG_SERIAL=1
    -DCORE_DEBUG_LEVEL=2

; Bring-up/Selbsttest für die Inbetriebnahme (docs/bring-up.md):
;   pio run -e tsim7080g-s3-bringup -t upload
; Danach die Kommandos im seriellen Monitor nutzen (r/m/g/t/i/p/l/b/s/h).
[env:tsim7080g-s3-bringup]
extends = base_s3
lib_deps =
    ${base_s3.lib_deps}
    lewisxhe/XPowersLib
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DUT_DEBUG_SERIAL=1
    -DUT_BRINGUP=1
    -DUT_HAS_PMU_LIB=1
    -DXPOWERS_CHIP_AXP2101=1
    -DCORE_DEBUG_LEVEL=2

; ---------------------------------------------------------------------------
; Host-Tests der plattformunabhängigen Logik (lib/tracker_core) – ohne Hardware.
; Aufruf:  pio test -e native      (braucht gcc/g++ auf dem Host)
; Unter Windows ohne MinGW: in der WSL oder in der CI ausführen.
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>          ; src/ ist Arduino-Code und wird hier nicht gebaut
lib_deps =
    bblanchon/ArduinoJson@7.2.1
build_flags =
    -std=gnu++11
    -DUNITY_INCLUDE_DOUBLE
